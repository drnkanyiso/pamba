{{ $page := .page }}
<article class="service-card">
  <div class="service-image-wrap">
    {{ partial "service-image.html" (dict "page" $page "detail" false) }}
  </div>
  <div class="service-card-copy">
    <span class="service-number" aria-hidden="true">{{ printf "%02d" $page.Weight }}</span>
    <h3><a href="{{ $page.RelPermalink }}">{{ $page.Title }}</a></h3>
    <p>{{ $page.Description }}</p>
    <a class="button button-service" href="{{ $page.RelPermalink }}" aria-label="Explore {{ $page.Title }}">Explore this area {{ partial "icon.html" "arrow" }}</a>
  </div>
</article>
