{{ $page := .Site.GetPage "/about-us" }}
{{ with resources.Get (strings.TrimPrefix "/" $page.Params.featured_image) }}
  {{ $small := .Resize "640x jpg q82" }}
  {{ $large := .Resize "1000x jpg q85" }}
  <img src="{{ $small.RelPermalink }}" srcset="{{ $small.RelPermalink }} 640w, {{ $large.RelPermalink }} 1000w" sizes="(max-width: 800px) calc(100vw - 32px), (max-width: 1264px) 45vw, 560px" alt="{{ $page.Params.image_alt }}" width="{{ $small.Width }}" height="{{ $small.Height }}" {{ if $.IsHome }}loading="lazy" decoding="async"{{ else }}fetchpriority="high"{{ end }}>
{{ end }}
